# Opt-in override to force a linux/amd64 target on a non-x86 host. Runs under emulation
# there and is expected to be slow — a single upsert batch has been observed to exceed
# the default 120s gRPC timeout on an ARM Mac. Not the default; apply explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.amd64.yml up -d
#
# Raise run.qdrant.timeout_s in config/run.yaml before indexing anything non-trivial
# under this override.
services:
  qdrant:
    platform: linux/amd64
