# Image tag is pinned; the manifest records it, and a result is only reproducible
# against the exact image. No `platform` is set deliberately: Qdrant ships a multi-arch
# manifest, so this runs NATIVE to whatever host executes it (no emulation) and latency
# is real for that machine. Use docker-compose.amd64.yml as an override to force
# linux/amd64 instead.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: reranking_benchmark_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # A named volume, NOT a host bind mount. A bind mount from macOS reaches the
      # container through the VM's virtiofs passthrough, where Qdrant reports
      # "Filesystem check failed ... may cause data corruption" and falls back off
      # multi-mmap with "you may see reduced performance". Storage here is mmap-heavy,
      # so that fallback lands straight on the latency and memory figures this
      # benchmark exists to measure. A named volume lives on the VM's own filesystem.
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: WARN
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: 4
      QDRANT__TELEMETRY_DISABLED: "true"
    # No memory limit: the memory phase reads Qdrant's own per-collection accounting,
    # and a cgroup cap would clip the figures being observed.

volumes:
  qdrant_storage:
    # Pinned explicitly so the volume name does not depend on the directory name or
    # COMPOSE_PROJECT_NAME. `run.qdrant.storage_volume` must match this.
    name: reranking_benchmark_qdrant_storage
