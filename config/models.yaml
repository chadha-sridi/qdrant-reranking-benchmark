# Model pinning. FastEmbed does not expose HF revision SHAs, so the real guarantee is
# the fastembed version in the lockfile plus the SHA-256 of every resolved model file,
# recorded at run time as manifest.model_file_digests.

dense:
  name: "BAAI/bge-small-en-v1.5"
  dim: 384
  distance: cosine
  max_length: 512
  # BAAI's own full-precision ONNX export. FastEmbed's built-in build of this model is
  # float16, which runs on a slow single-threaded fallback on CPUs without float16
  # arithmetic (AVX2-only x86), and every other model here is float32.
  onnx:
    hf: "BAAI/bge-small-en-v1.5"
    file: "onnx/model.onnx"
    pooling: cls
    normalize: true
  # Gate 1 checks this reference value: the baseline must reproduce the published NDCG,
  # or something is wrong in qrels parsing, ID mapping, or the metric call and every
  # downstream number is invalid.
  #
  # The value is the figure published on the model's own card (ndcg_at_10: 34.305 on
  # MTEB NFCorpus), confirmed there directly rather than taken on trust.
  #
  # Tolerance 0.02: wide enough for run-to-run HNSW noise, narrow enough that a genuine
  # qrels or ID-mapping fault, which drops NDCG by far more, still fails.
  reference:
    dataset: nfcorpus
    metric: "ndcg@10"
    value: 0.34305
    tolerance: 0.02
    source: "https://huggingface.co/BAAI/bge-small-en-v1.5 (model card, MTEB NFCorpus ndcg_at_10)"
    query_set: "all 323 nfcorpus test queries"
    observed: null
    verified: true

bm25:
  # The sparse first stage: Qdrant's BM25 scoring on a full-text index over the `text`
  # payload field, which already holds every document's text. Qdrant tokenizes both
  # documents and queries with these settings and derives IDF and the average document
  # length from the indexed corpus itself.
  # English Snowball stemming and English stopwords match standard English BM25 setups;
  # Qdrant's default (lowercasing only) would be a weaker baseline than published ones.
  # k and b are the textbook Lucene values, sent with every query.
  field: text
  tokenizer: word
  lowercase: true
  stemmer: english
  stopwords: english
  k: 1.2
  b: 0.75
  # Gate 1 for the sparse baseline: BM25 (Elasticsearch) from the BEIR paper. `observed`
  # is filled in from the first Gate 1 run through Qdrant.
  reference:
    dataset: nfcorpus
    metric: "ndcg@10"
    value: 0.325
    tolerance: 0.02
    source: "BEIR, Thakur et al. 2021 (arXiv:2104.08663), Table 2, BM25 on NFCorpus"
    query_set: "all 323 nfcorpus test queries"
    observed: null
    verified: true

late_interaction:
  # Chosen over answerai-colbert-small-v1 and mLateOn on NFCorpus, each model at its own
  # context window (DECISIONS.md O6). Runs on ONNX Runtime through FastEmbed, like every
  # other encoder here.
  name: "lightonai/LateOn"
  dim: 128
  distance: cosine
  # Multivectors are for rescoring only. m=0 is required, not optional.
  hnsw_m: 0
  comparator: max_sim

muvera:
  # fastembed.postprocess.Muvera — the reference implementation the MUVERA/Qdrant
  # ecosystem uses. k_sim/n_reps/d_proj are fastembed's own defaults (k_sim=5, r_reps=20,
  # dim_proj=16), matching the Qdrant MUVERA article's NFCorpus/ColBERTv2 benchmark
  # config. Run `benchmark calibrate-muvera` (real late-interaction embeddings) before
  # publishing any muvera number, and record the outcome here.
  source_tokens: late_interaction
  # Subtract the corpus mean token vector before FDE encoding, on both sides. Late
  # interaction embeddings are anisotropic -- they collapse into a narrow cone -- and
  # SimHash cannot partition a cone, since nearly every random hyperplane falls to one
  # side of it. Applies to the `muvera` vector only; the multivectors the rescoring
  # stage reads are stored uncentered.
  center: true
  # Selected by `tune-muvera` on NFCorpus and SciFact held-out warmup queries. At this
  # dimension, repetitions buy more recall than partitions: 4/16/40 reaches 0.92 and 0.85
  # recall@deepest-depth where 5/16/20 reaches 0.92 and 0.75, and halving to 5120 dims
  # (4/16/20) fails SciFact at 0.75.
  k_sim: 4          # -> 2**4 = 16 clusters
  n_reps: 40
  d_proj: 16
  # dim = n_reps * 2**k_sim * d_proj = 40 * 16 * 16 = 10240
  distance: cosine  # matches the Qdrant MUVERA tutorial's collection config
  # Fraction of the exact max_sim top-10 the FDE must recover at a dataset's deepest
  # candidate depth. A project convention, not a published standard: MUVERA's own paper
  # reports recall of the single nearest neighbour under Chamfer, a far easier target,
  # and tunes its candidate count per corpus to hit it.
  min_recall: 0.8
  # The FDE setting is chosen once on the tuning datasets and then applied everywhere, so
  # a dataset whose calibration falls short is a result to report rather than a gap to
  # leave in the comparison. The verdict is recorded per dataset in the manifest.
  require_calibration: false
  # Swept by `tune-muvera` on each tuning dataset's held-out warmup queries, never on the
  # evaluated ones. The selected setting is the smallest FDE whose recall@deepest-depth
  # reaches min_recall on every tuning dataset; it is then checked per dataset with
  # `calibrate-muvera` and judged end to end against the dense baseline.
  tuning_grid:
    k_sim: [4, 5, 6]
    d_proj: [16, 32]
    n_reps: [20, 40]
    datasets: [nfcorpus, scifact]
  calibrated: false
  calibrated_model: null
  calibration_note: >-
    Gated per dataset by its own calibration artifact rather than by this flag, so every
    dataset must earn the arm on its own held-out queries. With mean-centering these
    settings reach recall@deepest-depth 0.92 on NFCorpus and 0.85 on SciFact; without it
    the same settings reach 0.68 and the arm is not usable at all.

cross_encoder:
  # FastEmbed ships no reranker that beats the dense baseline on every dataset here:
  # ms-marco-MiniLM-L-6-v2 loses ndcg@10 on SciFact at every depth (-0.005 at 10,
  # -0.021 at 50), because MS MARCO web passages are far from scientific claims.
  # gte-reranker-modernbert-base gains on both of the datasets it was piloted on
  # (SciFact +0.032, NFCorpus +0.023) and is registered from its own ONNX export,
  # since FastEmbed does not ship it. It is ~10x slower per pair, which is what
  # execution.arm_depth_caps pays for.
  name: "Alibaba-NLP/gte-reranker-modernbert-base"
  onnx:
    hf: "Alibaba-NLP/gte-reranker-modernbert-base"
    file: "onnx/model.onnx"
  size_gb: 0.6
  license: "Apache-2.0"
