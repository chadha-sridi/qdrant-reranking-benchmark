# Global run configuration. Every value here lands in results/manifest.json.

seeds:
  query_subsample: 20250813   # picks the query subsample where a dataset is capped
  warmup_holdout: 20250813    # picks the warmup pool
  plan_shuffle: 20250813      # execution-plan shuffle
  muvera: 20250813            # SimHash + projection matrices

queries:
  # null = no cap: every dataset runs every judged query it has.
  # Kept as a settable field because scripts/smoke.py and quick debugging runs need to
  # limit queries; it is not a benchmark-configuration knob.
  cap: null
  # Held out from evaluation so no reported query is served from a warmup-warmed
  # cache. NOT a train split — nothing here trains. Shrinks
  # automatically on small query sets rather than starving evaluation.
  warmup_count: 50

execution:
  # One pass. Quality is deterministic given a fixed index (and is read from run_idx 0
  # regardless), and memory is read once from Qdrant after indexing — so repeats only
  # ever served latency percentiles. One pass already yields one sample per evaluated
  # query per (arm, depth), which is ample for p50/p95; p99 is not reported.
  repeats: 1
  final_limit: 10             # k for ndcg@10 / recall@10
  max_stored_results: 100     # capped to min(this, depth)
  flush_every: 25             # fsync cadence on raw JSONL
  # Default candidate depths, grounded in the measured relevant-docs-per-query
  # distribution of the enabled datasets rather than picked by feel.
  # Four of five datasets have every relevant document inside depth 50, so 200 is
  # already ~4x past saturation and depth 500 would add a second flat point for 56% of
  # the compute. NFCorpus overrides this upward in datasets.yaml — it is the one dataset
  # still gaining at depth.
  depths: [10, 25, 50, 100, 200]
  # The three server-side rescoring arms (*_late_interaction_rescore) each pay one extra,
  # untimed Qdrant call per query to measure how many relevant docs survived their
  # prefetch stage. Real added wall-clock cost (roughly doubles those arms' own
  # query-side work); no effect on any recorded latency. Set false to skip it and run faster.
  capture_pool_recall: true

qdrant:
  url: "http://localhost:6333"
  grpc_port: 6334
  # Transport for indexing. Queries always use gRPC regardless: Qdrant's self-reported
  # processing time is only readable off the gRPC response, and that split is the point.
  prefer_grpc: true
  timeout_s: 120
  image: "qdrant/qdrant:v1.20.0"
  container_name: "reranking_benchmark_qdrant"
  # Docker named volume (must match the `name:` in docker-compose.yml), not a host
  # directory. A bind mount from macOS goes through the VM's virtiofs passthrough, which
  # disables Qdrant's multi-mmap and degrades exactly the latency and memory this
  # benchmark measures.
  storage_volume: "reranking_benchmark_qdrant_storage"
  # Identical across all dense collections so graph construction variance is
  # minimised.
  hnsw:
    m: 16
    ef_construct: 100
    # Always use the HNSW graph. Qdrant's default (10000 KB) would silently full-scan
    # the two smallest datasets, so latency would compare ANN on the big corpora against
    # brute force on the small ones. 10 is Qdrant's minimum accepted value (it rejects 0)
    # and every segment here clears it. Does not affect the late-interaction vector,
    # whose m=0 means it has no graph to use in the first place.
    full_scan_threshold_kb: 10
  upsert_batch_size: 256
  # Restored after the upload finishes, which is what triggers the HNSW build. Indexing
  # is switched off during the upload itself. Qdrant's default is 20000 (KB).
  indexing_threshold_kb: 20000

ingestion:
  # Documents embedded and upserted together before moving to the next chunk. At this
  # size peak embedding memory for the widest representation (MUVERA, 10,240-dim) is
  # ~600 MB, independent of corpus size — Quora's 522,931 docs would otherwise need the
  # full corpus resident across dense+late_interaction+muvera at once.
  chunk_size: 10000

# Two first stages, each a baseline that the arms below rerank: dense (bge-small) and
# sparse (BM25). An arm is named after its first stage, so both families run in one
# interleaved pass against one collection and share one significance table.
# Hybrid-search/fusion arms are out of scope. All arms except the baselines sweep
# candidate depth.
arms:
  enabled:
    - dense                            # baseline: dense HNSW search
    - late_interaction_rescore         # dense prefetch -> late-interaction MaxSim
    - muvera_late_interaction_rescore  # MUVERA prefetch -> exact MaxSim (vs dense)
    - cross_encoder                    # dense prefetch -> client-side cross-encoder
    - bm25                             # baseline: BM25 sparse search
    - bm25_late_interaction_rescore    # BM25 prefetch -> late-interaction MaxSim
    - bm25_cross_encoder               # BM25 prefetch -> client-side cross-encoder
  # Declared but gated. Flip via CLI flags, not by editing this list.
  gated: {}

paths:
  results: "results"
  raw: "results/raw"
  agg: "results/agg"
  queries: "results/queries"
  cache: "cache"
  manifest: "results/manifest.json"
